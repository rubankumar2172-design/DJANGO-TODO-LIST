{% extends 'base.html' %}

{% block title %}
Login Page
{% endblock %}

{% block content %}
<div class="container text-center">
    <h4>Welcome to My Login Page</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Login</button>
    </form>
    <h4 class="mt-3">Don't Have An Account.?</h4>
    <a href="{% url 'signup' %}" class="btn btn-primary">Signup</a>
</div>

{% endblock content %}
