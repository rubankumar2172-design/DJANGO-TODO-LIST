{% extends 'base.html' %}

{% block title %}
Signup Page
{% endblock %}

{% block content %}
<div class="container text-center">
    <h4>Welcome to My Signup Page</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p  }}
        <button type="submit" class="btn btn-primary">Signup</button>
    </form>

    <h4 class="mt-3">Already Have an Account.?</h4>
    <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
</div>

{% endblock content %}
